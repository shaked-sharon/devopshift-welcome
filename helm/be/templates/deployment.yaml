# be deployment template
apiVersion: apps/v1
kind: Deployment
metadata:
  name: be-deployment
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: backend-service
  template:
    metadata:
      labels:
        app: backend-service
    spec:
      containers:
        - name: backend-service
          image: "{{ .Values.image.name }}:{{ .Values.image.tag }}"
          imagePullPolicy: Never
          ports:
            - containerPort: {{ .Values.service.port }}
          env:
            - name: MYSQL_HOST
              value: {{ .Values.env.mysqlHost }}
            - name: MYSQL_USER
              value: {{ .Values.env.mysqlUser }}
            - name: MYSQL_PASSWORD
              value: "{{ .Values.env.mysqlPassword }}"